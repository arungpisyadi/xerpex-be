# Nginx configuration for kebunsu-be-staging with proper CORS handling
# Place this file in /etc/nginx/sites-available/kebunsu-be-staging

server {
    listen 80;
    server_name kebunsu-be-staging.tugugroup.co.id;
    
    # CORS configuration with proper handling of multiple origins
    # This uses a map to set the $cors_origin variable based on the request's Origin header
    
    # First, set up a map to match allowed origins
    # This should be placed outside the server block, in the http context of your nginx.conf
    # or in a separate file in /etc/nginx/conf.d/
    # For reference only:
    # map $http_origin $cors_origin {
    #     default "";
    #     "https://kebunsu.tugugroup.co.id" "$http_origin";
    #     "https://kebunsu-staging.tugugroup.co.id" "$http_origin";
    #     "http://localhost:3000" "$http_origin";
    #     "http://localhost:8000" "$http_origin";
    # }
    
    # Set CORS headers based on the $cors_origin variable
    set $cors_origin "";
    
    if ($http_origin ~ '^https?://(kebunsu|kebunsu-staging)\.tugugroup\.co\.id$') {
        set $cors_origin $http_origin;
    }
    
    if ($http_origin ~ '^http://localhost:(3000|8000)$') {
        set $cors_origin $http_origin;
    }
    
    # Add CORS headers only if $cors_origin is set
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    
    location / {
        # Handle preflight requests (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Proxy configuration
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings - increased to handle longer processing times
        proxy_connect_timeout 60s;     # Increased from 10s to 60s
        proxy_send_timeout 300s;       # Increased from 60s to 300s
        proxy_read_timeout 600s;       # Increased from 120s to 600s
        send_timeout 300s;             # Increased from 60s to 300s
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 64 4k;
    }
}