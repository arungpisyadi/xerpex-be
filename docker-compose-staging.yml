version: '3.8'

services:
  api:
    build: .
    container_name: kebunsu-api-staging
    restart: always
    
    # For connecting to a remote database server, use bridge networking (default)
    # This allows outbound connections to external resources
    ports:
      - "8000:8000"
    # Using default bridge network - no custom networks needed
    
    # NOTE: Do not use host network mode with remote database connections
    # network_mode: "host"

    # For Windows users with Docker Desktop connecting to a database on localhost:
    # Use extra_hosts to map host.docker.internal to the host IP
    # This is only needed for Windows/macOS when connecting to a local database
    # It's not needed for remote database connections
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-XerpeX ERP System}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      # Database connection settings
      # These will be loaded from .env.staging for remote database connection
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000","https://kebunsu-staging.tugugroup.co.id"]}
    volumes:
      - ./:/app
    command: >
      bash -c "python test_db_connection.py"

# Using default bridge network - no custom networks needed
